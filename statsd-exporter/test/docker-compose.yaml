---
# Used for local testing
version: "3"
services:
  statsd:
    build:
      context: .
      dockerfile: ./Dockerfile.statsd
    networks:
      - statsd
    ports:
      # where to listen with UDP for metrics
      - ${STATSD_TEST_STATSD_PORT:-8125}:8125/udp
      # where to listen with TCP for metrics
      - ${STATSD_TEST_STATSD_TCP_PORT:-8126}:8126

  statsd-exporter:
    build:
      context: ..
    networks:
      - statsd
    command: --statsd.mapping-config=/etc/statsd-exporter/mappings.yml

    ports:
      # TCP metrics listen
      - ${STATSD_TEST_EXPORTER_STATSD_PORT:-9125}:9125
      # prometheus metrics server
      - ${STATSD_TEST_EXPORTER_PORT:-9102}:9102

networks:
  statsd: {}
