[libdefaults]
  default_realm = KRB.TEST
  dns_lookup_realm = false
  dns_lookup_kdc = false
  dns_canonicalize_hostname = false
  rdns = false
  udp_preference_limit = 1
  # Postgres accepts tickets up to clockskew seconds past expiry (default 300); keep the expiry test short.
  clockskew = 5

[realms]
  KRB.TEST = {
    kdc = kdc.krb.test
    admin_server = kdc.krb.test
  }

[domain_realm]
  .krb.test = KRB.TEST
