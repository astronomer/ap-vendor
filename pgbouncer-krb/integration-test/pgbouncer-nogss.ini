[databases]
gssdb = host=postgres.krb.test port=5432 dbname=postgres user=houston

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
; md5 is the image's default. Users with a SCRAM secret in userlist.txt get SCRAM instead.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
server_gssauth_negotiate = disable
; Fail the client fast instead of waiting out the 120s default.
query_wait_timeout = 5
